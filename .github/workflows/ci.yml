name: Build and test

# Every push to main and every pull request: the app builds and all tests pass, so a broken build
# shows up here and not only when a release is cut.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # Nightforge needs macOS 26: its SDK and a Swift that knows its APIs (Xcode 26).
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Build the app
        run: ./build.sh

      # Every tests/*Test at once, one per core, each with its own log and exit code: all logs land in
      # groups, a failed series' log once more at the end, and any failure fails the job.
      - name: Swift tests
        run: scripts/run-tests.sh

      - name: Profile builder tests
        run: python3 -m unittest tests/test_build_profiles.py

      - name: Component list
        run: python3 -I scripts/validate-manifest.py
