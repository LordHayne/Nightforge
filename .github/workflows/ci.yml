name: Build and test

# Every push to main and every pull request: the app builds and all tests pass, so a broken build
# shows up here and not only when a release is cut.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # Nightforge needs macOS 26: its SDK and a Swift that knows its APIs (Xcode 26).
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Build the app
        run: ./build.sh

      # Stand-ins for the compiler: the shortcut below only takes what it prepared, and a failure stays one.
      - name: Test build shortcut
        run: python3 -m unittest tests/test_testbuild.py

      # Every tests/*Test at once, one per core, each with its own log and exit code: all logs land in
      # groups, a failed series' log once more at the end, and any failure fails the job.
      # The app is compiled once for all of them; a series builds only its own files (scripts/testbuild/swiftc).
      - name: Swift tests
        run: scripts/run-tests.sh

      # The one check that asks the real `ps -ax`; the series above hand ProcessList a list of their own.
      - name: Live process list
        run: tests/ProcessListLive/run.sh

      - name: Profile builder tests
        run: python3 -m unittest tests/test_build_profiles.py

      # Against stand-ins for the Keychain, the clipboard and GitHub: no key, no network.
      - name: Signing scripts
        run: python3 -m unittest tests/test_signing_scripts.py

      - name: Component list
        run: python3 -I scripts/validate-manifest.py

      # Against made-up wiki pages and store answers: no network.
      - name: AppleGamingWiki import and test basket tests
        run: python3 -m unittest tests/test_fetch_agw.py tests/test_test_basket.py

      # Against stand-ins for security and codesign: no keychain, no certificate.
      - name: Code signing script
        run: python3 -m unittest tests/test_codesign_app.py

      # What may stay x86_64 only, the arm64 build of Nightforge's helpers, and what the ARM64 preparation keeps.
      - name: Processor rules
        run: python3 -m unittest tests/test_component_arch.py tests/test_no_new_x86_only.py tests/test_helper_architectures.py tests/test_wine_folders.py tests/test_game_test_baseline.py tests/test_arm64_watchlist.py tests/test_macos28_probe.py tests/test_rosetta_notice.py

      # A shell script a workflow runs as a command has to be executable in git: enginefix.yml's never ran (2.11.).
      - name: Workflow scripts
        run: python3 -m unittest tests/test_workflow_scripts.py

      # The switches for Nightforge's own tests stand in the #else of NIGHTFORGE_RELEASE, key and all, and
      # release.yml looks for each of them in the build: the finished build tracks nothing.
      - name: Test switches stay out of a release
        run: python3 -m unittest tests/test_release_switches.py
