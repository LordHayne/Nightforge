name: Build graphics package

# DXMT (Direct3D 10/11 → Metal) patched for Wine 11, plus Wine's Mac driver rebuilt with visible
# symbols so DXMT can attach its Metal layer to game windows, ntdll.so + wineserver with msync
# (engine/patches/wine-*.patch), and winebus.so with the SDL bus for controllers (winebus-11.18-*.patch). Published as one release asset that components/manifest.json points
# to – from main only, so a run on another branch just checks that everything builds.
# WINE_VERSION must match the engine pinned in sources.json.

on:
  workflow_dispatch:
  push:
    branches: [main]
    # Only the patches this package is built with: winecx's go to gamepad.yml and enginefix.yml.
    paths:
      - "engine/patches/dxmt-*.patch"
      - "engine/patches/wine-*.patch"
      - "engine/patches/winebus-11.18-*.patch"
      - ".github/workflows/graphics.yml"

# Only the package job publishes; the build jobs run upstream code (DXMT, LLVM, Wine) and get a
# read-only token that isn't left in the checkout.
permissions:
  contents: read

# Every input is pinned (review G): a clone by its tag has to be the commit below, and a download its
# SHA-256, or the build stops. A moved tag or a replaced file is then a change someone makes here.
env:
  WINE_VERSION: "11.18"
  WINE_COMMIT: 7b3fff76fa5178f6ce0141b2c776afa2a822f101  # wine-11.18 on gitlab.winehq.org
  # Gcenx's build of this Wine (the engine's Vulkan loader and libinotify): the same SHA-256 as the "wine"
  # component in components/manifest.json and as GitHub gives for the asset.
  GCENX_SHA256: aa0ea4c82e636ae7bca2076387cb0a5affa26509ad13f119ecd0d62bd7ba6f82
  # Header for the engine's libinotify (libinotify-kqueue), which wineserver links like Gcenx's does.
  LIBINOTIFY_TAG: "20240724"
  LIBINOTIFY_COMMIT: 0de168e0a9363f6f261e59f93b9f976b57d4fab6
  LIBINOTIFY_SHA256: 8b59eb4e1c93299a20855b4eeae7903162b486a60ff8e11221b21a7364dbf0d4
  DXMT_VERSION: v0.80
  DXMT_COMMIT: 589adb780354b461645b29999cefaf533594ee99
  LLVM_VERSION: llvmorg-15.0.7
  LLVM_COMMIT: 8dfdcc7b7bf66834a761bd8de445840ef68e4d1a
  # Wine headers/tools DXMT builds against (from DXMT's own CI). GitHub has no digest for this 2023 asset:
  # the SHA-256 is the file's as it was on 3.11.2026.
  WINE_TOOLCHAIN_URL: https://github.com/3Shain/wine/releases/download/v8.16-3shain/wine.tar.gz
  WINE_TOOLCHAIN_SHA256: 289c7f19e270a3d3d0a6fdb07691b176c70a0795f6811e5255cba82425de4f10

jobs:
  llvm:
    # DXMT's shader compiler (airconv) links LLVM 15 built for macOS x86_64. ~1 h once, then cached.
    runs-on: macos-15
    steps:
      - name: Cache LLVM
        id: cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          key: llvm-darwin-${{ env.LLVM_VERSION }}-x86_64
          path: toolchains/llvm-darwin
          lookup-only: true

      - name: Build LLVM (x86_64)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          brew list --versions ninja > /dev/null || brew install ninja || { echo "::error::brew couldn't install ninja"; exit 1; }
          git clone --depth 1 --branch "$LLVM_VERSION" https://github.com/llvm/llvm-project.git toolchains/llvm-project
          test "$(git -C toolchains/llvm-project rev-parse HEAD)" = "$LLVM_COMMIT" \
            || { echo "::error::$LLVM_VERSION isn't commit $LLVM_COMMIT any more"; exit 1; }
          cmake -B toolchains/llvm-build -S toolchains/llvm-project/llvm \
            -DCMAKE_INSTALL_PREFIX="$PWD/toolchains/llvm-darwin" \
            -DCMAKE_OSX_ARCHITECTURES=x86_64 \
            -DLLVM_HOST_TRIPLE=x86_64-apple-darwin \
            -DLLVM_ENABLE_ASSERTIONS=On \
            -DLLVM_ENABLE_ZSTD=Off \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_TARGETS_TO_BUILD="" \
            -DLLVM_BUILD_TOOLS=Off \
            -G Ninja
          cmake --build toolchains/llvm-build
          cmake --install toolchains/llvm-build

      - name: Save LLVM
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          key: llvm-darwin-${{ env.LLVM_VERSION }}-x86_64
          path: toolchains/llvm-darwin

  dxmt:
    needs: llvm
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Fetch DXMT and apply Nightforge patches
        run: |
          git clone --depth 1 --branch "$DXMT_VERSION" --recurse-submodules --shallow-submodules \
            https://github.com/3Shain/dxmt.git dxmt
          # Its submodules are pinned by this commit.
          test "$(git -C dxmt rev-parse HEAD)" = "$DXMT_COMMIT" \
            || { echo "::error::DXMT $DXMT_VERSION isn't commit $DXMT_COMMIT any more"; exit 1; }
          # DXMT v0.80 is MIT, with DXVK code (zlib) and NVIDIA's NVAPI headers (MIT) built in: their
          # licences and the untouched source (submodules included) go into the release.
          mkdir -p source
          git -C dxmt rev-parse HEAD > source/dxmt-commit.txt
          cp dxmt/LICENSE source/LICENSE-DXMT.txt
          cp dxmt/src/util/dxvk.LICENSE source/LICENSE-DXVK.txt
          cp dxmt/external/nvapi/License.txt source/LICENSE-NVAPI.txt
          tar -cJf "source/dxmt-$DXMT_VERSION.tar.xz" --exclude=.git dxmt
          for patch in engine/patches/dxmt-*.patch; do
            echo "Applying $patch"
            git -C dxmt apply --verbose "$GITHUB_WORKSPACE/$patch"
          done

      - name: Restore LLVM
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          key: llvm-darwin-${{ env.LLVM_VERSION }}-x86_64
          path: toolchains/llvm-darwin
          fail-on-cache-miss: true

      - name: Toolchain
        run: |
          for formula in mingw-w64 ninja; do
            brew list --versions "$formula" > /dev/null || brew install "$formula" \
              || { echo "::error::brew couldn't install $formula"; exit 1; }
          done
          printf '%s\n' 'meson==1.10.0 --hash=sha256:4b27aafce281e652dcb437b28007457411245d975c48b5db3a797d3e93ae1585 --hash=sha256:8071860c1f46a75ea34801490fd1c445c9d75147a65508cd3a10366a7006cc1c' \
            > "$RUNNER_TEMP/meson.txt"
          pip3 install --require-hashes -r "$RUNNER_TEMP/meson.txt" --break-system-packages
          sudo xcode-select -s /Applications/Xcode_16.1.app
          mkdir -p dxmt/toolchains/wine
          curl -fsSL -o "$RUNNER_TEMP/wine-toolchain.tar.gz" "$WINE_TOOLCHAIN_URL"
          echo "$WINE_TOOLCHAIN_SHA256  $RUNNER_TEMP/wine-toolchain.tar.gz" | shasum -a 256 -c -
          tar -xz -C dxmt/toolchains/wine -f "$RUNNER_TEMP/wine-toolchain.tar.gz"
          mv toolchains/llvm-darwin dxmt/toolchains/llvm-darwin

      - name: Build 64-bit
        working-directory: dxmt
        run: |
          meson setup --cross-file build-win64.txt -Denable_nvapi=true -Denable_nvngx=true \
            -Dnative_llvm_path=toolchains/llvm-darwin -Dwine_install_path=toolchains/wine \
            build --buildtype release --prefix "$PWD/install64" --strip
          meson compile -C build
          meson install -C build

      - name: Build 32-bit
        working-directory: dxmt
        run: |
          meson setup --cross-file build-win32.txt -Dwine_install_path=toolchains/wine \
            build32 --buildtype release --prefix "$PWD/install32" --strip
          meson compile -C build32
          meson install -C build32

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dxmt
          path: |
            dxmt/install64
            dxmt/install32

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dxmt-source
          path: source

  winemac:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: nightforge
          persist-credentials: false

      - name: Tools and sources
        run: |
          for formula in bison flex pkg-config mingw-w64; do
            brew list --versions "$formula" > /dev/null || brew install "$formula" \
              || { echo "::error::brew couldn't install $formula"; exit 1; }
          done
          git clone --depth 1 --branch "wine-$WINE_VERSION" https://gitlab.winehq.org/wine/wine.git wine
          test "$(git -C wine rev-parse HEAD)" = "$WINE_COMMIT" \
            || { echo "::error::wine-$WINE_VERSION isn't commit $WINE_COMMIT any more"; exit 1; }
          # Wine is LGPL: its untouched source and licence go into the release (winebus builds from the same tag).
          mkdir -p source
          git -C wine rev-parse HEAD > source/wine-commit.txt
          cp wine/COPYING.LIB source/COPYING-Wine.txt
          cp wine/LICENSE source/LICENSE-Wine.txt
          git -C wine archive --format=tar --prefix="wine-$WINE_VERSION/" HEAD | tar -cJf "source/wine-$WINE_VERSION.tar.xz" @-
          for patch in nightforge/engine/patches/wine-*.patch; do
            echo "Applying $patch"
            git -C wine apply --verbose "$GITHUB_WORKSPACE/$patch"
          done
          # Link against the same Vulkan loader and libinotify the engine ships (Gcenx build of this Wine version).
          mkdir -p gcenx
          curl -fsSL -o "$RUNNER_TEMP/gcenx.tar.xz" \
            "https://github.com/Gcenx/macOS_Wine_builds/releases/download/$WINE_VERSION/wine-devel-$WINE_VERSION-osx64.tar.xz"
          echo "$GCENX_SHA256  $RUNNER_TEMP/gcenx.tar.xz" | shasum -a 256 -c -
          tar -xJ -C gcenx -f "$RUNNER_TEMP/gcenx.tar.xz"
          ln -s "$PWD/gcenx/Wine Devel.app/Contents/Resources/wine/lib" gcenxlib
          mkdir -p inotify/sys
          # By the tag's commit, not the tag; and the file by its SHA-256.
          curl -fsSL "https://raw.githubusercontent.com/libinotify-kqueue/libinotify-kqueue/$LIBINOTIFY_COMMIT/sys/inotify.h" \
            -o inotify/sys/inotify.h
          echo "$LIBINOTIFY_SHA256  inotify/sys/inotify.h" | shasum -a 256 -c -

      - name: Configure (x86_64, visible symbols)
        run: |
          export PATH="$(brew --prefix bison)/bin:$(brew --prefix flex)/bin:$PATH"
          mkdir build && cd build
          # ntdll keeps the system unwinder (no --without-unwind), as in the engine's own build.
          ../wine/configure --host=x86_64-apple-darwin --enable-win64 --disable-tests \
            --without-freetype --without-x --without-gstreamer --without-cups --without-sane \
            --without-krb5 --without-gssapi --without-sdl --without-usb --without-pcap \
            --without-netapi --without-gnutls \
            CC="clang -arch x86_64" CXX="clang++ -arch x86_64" \
            CPPFLAGS="-I$GITHUB_WORKSPACE/inotify" \
            CFLAGS="-fvisibility=default -O2 -Wno-error -mmacosx-version-min=11.0" \
            LDFLAGS="-L$GITHUB_WORKSPACE/gcenxlib -Wl,-rpath,@loader_path/../lib -mmacosx-version-min=11.0"
          # configure picks up otool's description instead of the install name; use what Gcenx uses.
          sed -i '' 's|^#define SONAME_LIBVULKAN .*|#define SONAME_LIBVULKAN "libvulkan.1.dylib"|' include/config.h
          grep -q "define HAVE_SYS_INOTIFY_H 1" include/config.h || { echo "wineserver would lose inotify"; exit 1; }

      - name: Build winemac.so
        working-directory: build
        run: |
          export PATH="$(brew --prefix bison)/bin:$(brew --prefix flex)/bin:$PATH"
          make -j"$(sysctl -n hw.logicalcpu)" dlls/winemac.drv/winemac.so
          exports=$(nm -g dlls/winemac.drv/winemac.so | awk '$2=="T"' | wc -l | tr -d ' ')
          echo "exported functions: $exports"
          test "$exports" -ge 100
          for sym in OnMainThread macdrv_get_cocoa_window macdrv_view_create_metal_view macdrv_view_get_metal_layer macdrv_view_release_metal_view; do
            nm -g dlls/winemac.drv/winemac.so | grep -q " T _$sym$" || { echo "missing $sym"; exit 1; }
          done

      - name: Build ntdll.so and wineserver (msync)
        working-directory: build
        run: |
          export PATH="$(brew --prefix bison)/bin:$(brew --prefix flex)/bin:$PATH"
          make -j"$(sysctl -n hw.logicalcpu)" dlls/ntdll/ntdll.so server/wineserver
          nm dlls/ntdll/ntdll.so | grep -q "msync_wait_objs" || { echo "ntdll.so without msync"; exit 1; }
          nm server/wineserver | grep -q "msync_init" || { echo "wineserver without msync"; exit 1; }
          nm -u dlls/ntdll/ntdll.so | grep -q "_Unwind_Find_FDE" || { echo "ntdll.so without the system unwinder"; exit 1; }
          # The engine's libinotify is found next to it, under the name the engine's own wineserver uses.
          current=$(otool -L server/wineserver | awk '/inotify/ { print $1 }')
          test -n "$current" || { echo "wineserver without libinotify"; exit 1; }
          install_name_tool -change "$current" @rpath/libinotify.0.dylib server/wineserver
          otool -L server/wineserver
          otool -L dlls/ntdll/ntdll.so

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: winemac
          path: |
            build/dlls/winemac.drv/winemac.so
            build/dlls/ntdll/ntdll.so
            build/server/wineserver

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wine-source
          path: source

  winebus:
    # Wine's HID bus with the SDL bus compiled in, which reads a DualSense, DualShock 4 or Switch pad
    # (macOS keeps PlayStation pads in a report mode Wine's plain IOHID bus can't read), plus
    # engine/patches/winebus-11.18-*.patch (this Wine version only; winebus-winecx-* is gamepad.yml's): a pad SDL maps reports itself as an Xbox 360 controller, so
    # XInput games and engines that know the real pad (Unity's Input System) both take it.
    runs-on: macos-15
    env:
      SDL_HEADERS_TAG: release-2.32.8  # the SDL the engine ships (libSDL2-2.0.0.dylib, dlopened by name)
      SDL_HEADERS_COMMIT: 98d1f3a45aae568ccd6ed5fec179330f47d4d356
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: nightforge

      - name: Tools and sources
        run: |
          for formula in bison flex pkg-config mingw-w64; do
            brew list --versions "$formula" > /dev/null || brew install "$formula" \
              || { echo "::error::brew couldn't install $formula"; exit 1; }
          done
          git clone --depth 1 --branch "wine-$WINE_VERSION" https://gitlab.winehq.org/wine/wine.git wine
          test "$(git -C wine rev-parse HEAD)" = "$WINE_COMMIT" \
            || { echo "::error::wine-$WINE_VERSION isn't commit $WINE_COMMIT any more"; exit 1; }
          for patch in nightforge/engine/patches/winebus-"$WINE_VERSION"-*.patch; do
            echo "Applying $patch"
            git -C wine apply --verbose "$GITHUB_WORKSPACE/$patch"
          done
          git clone -q --depth 1 --branch "$SDL_HEADERS_TAG" https://github.com/libsdl-org/SDL.git sdl
          test "$(git -C sdl rev-parse HEAD)" = "$SDL_HEADERS_COMMIT" \
            || { echo "::error::SDL $SDL_HEADERS_TAG isn't commit $SDL_HEADERS_COMMIT any more"; exit 1; }

      - name: Configure (x86_64, SDL bus)
        run: |
          export PATH="$(brew --prefix bison)/bin:$(brew --prefix flex)/bin:$PATH"
          mkdir build && cd build
          ../wine/configure --host=x86_64-apple-darwin --enable-win64 --disable-tests \
            --without-freetype --without-x --without-gstreamer --without-cups --without-sane \
            --without-krb5 --without-gssapi --without-usb --without-pcap --without-netapi --without-gnutls \
            CC="clang -arch x86_64" CXX="clang++ -arch x86_64" \
            SDL2_CFLAGS="-I$GITHUB_WORKSPACE/sdl/include" \
            CFLAGS="-O2 -Wno-error -mmacosx-version-min=11.0" \
            LDFLAGS="-mmacosx-version-min=11.0"
          # configure can't link its x86_64 test against the runner's SDL; winebus only dlopens it
          # by name at runtime, so the name is all it needs (the engine's).
          if grep -q "SONAME_LIBSDL2" include/config.h; then
            sed -i '' 's|^.*SONAME_LIBSDL2.*$|#define SONAME_LIBSDL2 "libSDL2-2.0.0.dylib"|' include/config.h
          else
            echo '#define SONAME_LIBSDL2 "libSDL2-2.0.0.dylib"' >> include/config.h
          fi
          # configure clears SDL2_CFLAGS when that link test fails; the SDL bus needs the headers.
          if grep -q "^SDL2_CFLAGS" Makefile; then
            sed -i '' "s|^SDL2_CFLAGS *=.*|SDL2_CFLAGS = -I$GITHUB_WORKSPACE/sdl/include|" Makefile
          else
            echo "SDL2_CFLAGS = -I$GITHUB_WORKSPACE/sdl/include" >> Makefile
          fi

      - name: Build winebus.so
        working-directory: build
        run: |
          export PATH="$(brew --prefix bison)/bin:$(brew --prefix flex)/bin:$PATH"
          make -j"$(sysctl -n hw.logicalcpu)" dlls/winebus.sys/winebus.so
          so=dlls/winebus.sys/winebus.so
          strings "$so" | grep -q "libSDL2-2.0.0.dylib" || { echo "winebus.so without SDL"; exit 1; }
          nm "$so" | grep -q "sdl_bus_init" || { echo "no SDL bus"; exit 1; }
          strings "$so" | grep -q "XBOX 360 For Windows" || { echo "Xbox 360 IDs patch missing"; exit 1; }
          # Where the engine's own winebus.so finds ntdll.so and SDL: next to it, and the engine's lib/
          # (two levels up from lib/wine/x86_64-unix; the game bundle has links in the same places).
          for rpath in @loader_path/ @loader_path/../../; do
            otool -l "$so" | grep -q "path $rpath " || install_name_tool -add_rpath "$rpath" "$so"
          done
          otool -l "$so" | grep -A2 LC_RPATH
          codesign -fs - "$so"
          otool -L "$so"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: winebus
          path: build/dlls/winebus.sys/winebus.so

  package:
    needs: [dxmt, winemac, winebus]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: nightforge
          persist-credentials: false
          sparse-checkout: |
            engine/patches
            .github/workflows/graphics.yml
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts

      - name: Assemble
        id: assemble
        run: |
          root="graphics"
          mkdir -p "$root/x86_64-windows" "$root/i386-windows" "$root/x86_64-unix"
          find artifacts/dxmt/install64 -name '*.dll' -exec cp {} "$root/x86_64-windows/" \;
          find artifacts/dxmt/install32 -name '*.dll' -exec cp {} "$root/i386-windows/" \;
          find artifacts/dxmt -name 'winemetal.so' -exec cp {} "$root/x86_64-unix/" \;
          find artifacts/winemac -name winemac.so -exec cp {} "$root/x86_64-unix/winemac.so" \;
          find artifacts/winebus -name winebus.so -exec cp {} "$root/x86_64-unix/winebus.so" \;
          test -s "$root/x86_64-unix/winebus.so"
          # msync's ntdll.so and wineserver only work together (server protocol 963), so they sit in a
          # folder of their own that only Nightforge versions which install both at once pick up.
          mkdir -p "$root/msync/x86_64-unix" "$root/msync/bin"
          find artifacts/winemac -name ntdll.so -exec cp {} "$root/msync/x86_64-unix/ntdll.so" \;
          find artifacts/winemac -name wineserver -exec cp {} "$root/msync/bin/wineserver" \;
          chmod +x "$root/msync/bin/wineserver"
          test -s "$root/x86_64-unix/winemac.so" && test -s "$root/msync/x86_64-unix/ntdll.so" && test -s "$root/msync/bin/wineserver"
          version="${WINE_VERSION}-dxmt${DXMT_VERSION#v}-${GITHUB_RUN_NUMBER}"
          name="nightforge-graphics-$version.tar.gz"
          # Licence texts travel with the binaries; the corresponding source Wine's LGPL-2.1 asks for
          # (untouched upstream, Nightforge's patches, this workflow as the build script) is a second
          # asset. .tar.xz so it doesn't match the package asset pattern in components/sources.json.
          source="nightforge-graphics-$version-source"
          mkdir -p "$root/licenses" "$source/patches"
          cp artifacts/dxmt-source/LICENSE-*.txt artifacts/wine-source/COPYING-Wine.txt \
            artifacts/wine-source/LICENSE-Wine.txt "$root/licenses/"
          cp artifacts/dxmt-source/*.tar.xz artifacts/wine-source/*.tar.xz "$source/"
          cp "$root"/licenses/* "$source/"
          cp nightforge/engine/patches/dxmt-*.patch nightforge/engine/patches/wine-*.patch \
            nightforge/engine/patches/winebus-"$WINE_VERSION"-*.patch "$source/patches/"
          cp nightforge/.github/workflows/graphics.yml "$source/"
          notice="Nightforge graphics package $version

          DXMT $DXMT_VERSION ($(cat artifacts/dxmt-source/dxmt-commit.txt)), https://github.com/3Shain/dxmt
            -> x86_64-windows/, i386-windows/, x86_64-unix/winemetal.so. MIT (LICENSE-DXMT.txt), with code
            from DXVK (zlib, LICENSE-DXVK.txt) and NVIDIA's NVAPI headers (MIT, LICENSE-NVAPI.txt).
          Wine $WINE_VERSION ($(cat artifacts/wine-source/wine-commit.txt)), https://gitlab.winehq.org/wine/wine
            -> x86_64-unix/winemac.so, x86_64-unix/winebus.so, msync/. LGPL-2.1-or-later (COPYING-Wine.txt, LICENSE-Wine.txt).

          The corresponding source is the release asset $source.tar.xz: the untouched upstream
          sources, Nightforge's patches (applied in name order) and graphics.yml, the workflow that builds them."
          printf '%s\n' "$notice" > "$root/licenses/NOTICE.txt"
          cp "$root/licenses/NOTICE.txt" "$source/"
          ls -lR "$root" "$source"
          tar -czf "$name" "$root"
          tar -cf "$source.tar" "$source"
          xz -T0 "$source.tar"
          sha256sum "$name" "$source.tar.xz"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "source=$source.tar.xz" >> "$GITHUB_OUTPUT"

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "graphics-${{ steps.assemble.outputs.version }}" "${{ steps.assemble.outputs.name }}" \
            "${{ steps.assemble.outputs.source }}" \
            --repo "$GITHUB_REPOSITORY" --latest=false \
            --title "Graphics ${{ steps.assemble.outputs.version }}" \
