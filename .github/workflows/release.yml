name: Release app

# Builds Nightforge.app and drafts a GitHub release with it (zip for the installer script and the
# in-app updater, DMG for people who download by hand). Triggered by pushing a tag like v0.1.0.
# The app is ad-hoc signed (no paid Apple developer account): scripts/install.sh downloads it
# without the quarantine flag, so macOS opens it straight away; the DMG needs one
# "Open Anyway" in System Settings → Privacy & Security.
#
# The release stays a draft: the app installs an update only with the maintainer's Ed25519
# signature, and the private key isn't on GitHub. scripts/sign-release.sh <tag> --publish on the
# maintainer's Mac adds Nightforge-<version>.zip.sig and publishes; with immutable releases nothing
# can be added after that. A tag with a suffix (v0.3.1-rc.1) becomes a prerelease, a test release
# that neither the app nor install.sh offers (docs/SICHERHEIT-0.3.md › Test-Release).

on:
  push:
    tags: ["v*"]
  # Dry run: builds and packages, uploads the files as a workflow artifact, publishes nothing.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    # Nightforge needs macOS 26: its SDK and a Swift that knows its APIs (Xcode 26).
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      # Every installed copy offers the newest release as an update, so only commits on main ship.
      - name: Tag is on main
        if: github.ref_type == 'tag'
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "$GITHUB_REF_NAME is not on main"; exit 1; }

      # A release without the public keys would turn down every update after it: its players could
      # only come back through the curl line.
      - name: Signing keys are in
        if: github.ref_type == 'tag'
        run: |
          . scripts/signing-lib.sh
          build_signing_tool . "$RUNNER_TEMP"
          "$TOOL" keys > /dev/null || { echo "Sources/Nightforge/SigningKeys.swift needs both keys (scripts/make-signing-keys.sh)"; exit 1; }

      - name: Set version
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then version="${GITHUB_REF_NAME#v}"; else version="0.0.0-test"; fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $version" Resources/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $GITHUB_RUN_NUMBER" Resources/Info.plist

      # Nightforge's own code signing identity (docs/CODESIGNATUR.md): every release has the
      # same designated requirement, so macOS keeps the player's permissions (an external drive,
      # Accessibility) across updates. Its certificate's SHA-1 is pinned in scripts/codesign-certificate.sha1,
      # so a different one can't slip in and make every Mac ask again. Without the secrets: ad hoc, as before.
      - name: Code signing identity
        env:
          P12: ${{ secrets.NIGHTFORGE_CODESIGN_P12 }}
          P12_PASSWORD: ${{ secrets.NIGHTFORGE_CODESIGN_PASSWORD }}
        run: |
          pinned="$(grep -v '^#' scripts/codesign-certificate.sha1 2>/dev/null | tr -d '[:space:]' | tr 'a-f' 'A-F' || true)"
          if [ -z "$P12" ]; then
            [ -z "$pinned" ] || { echo "::error::scripts/codesign-certificate.sha1 names a certificate, but the NIGHTFORGE_CODESIGN_P12 secret is missing."; exit 1; }
            echo "::warning::No NIGHTFORGE_CODESIGN_P12 secret: signed ad hoc, so macOS asks for its permissions again after this update."
            exit 0
          fi
          keychain="$RUNNER_TEMP/codesign.keychain-db"
          password="$(uuidgen)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/codesign.p12"
          security import "$RUNNER_TEMP/codesign.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign > /dev/null
          rm -f "$RUNNER_TEMP/codesign.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" > /dev/null
          # codesign looks for the identity in the search list.
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity="$(security find-identity -p codesigning "$keychain" | awk '/"Nightforge Code Signing"/ { print $2; exit }')"
          [ -n "$identity" ] || { echo "::error::The p12 holds no identity named \"Nightforge Code Signing\"."; exit 1; }
          [ -z "$pinned" ] || [ "$identity" = "$pinned" ] \
            || { echo "::error::The secret's certificate ($identity) isn't the one in scripts/codesign-certificate.sha1 ($pinned)."; exit 1; }
          echo "Signing with $identity"
          echo "NIGHTFORGE_CODESIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "NIGHTFORGE_CODESIGN_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Build
        run: ./build.sh

      - name: Package
        run: |
          app=build/Nightforge.app
          codesign --verify --deep "$app"
          ditto -c -k --sequesterRsrc --keepParent "$app" "Nightforge-$VERSION.zip"
          # The drag-to-Applications window: background and icon positions in scripts/dmg-settings.py.
          python3 -m pip install --quiet --break-system-packages --require-hashes -r scripts/dmgbuild-requirements.txt
          python3 -m dmgbuild -s scripts/dmg-settings.py -D app="$app" Nightforge "Nightforge-$VERSION.dmg"
          hdiutil verify "Nightforge-$VERSION.dmg"
          shasum -a 256 Nightforge-*

      - name: Keep dry-run files
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nightforge-test-build
          path: Nightforge-*

      - name: Draft the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A test release (a tag with a suffix) is a prerelease: /releases/latest leaves it out.
          kind=()
          case "$VERSION" in *-*) kind=(--prerelease) ;; esac
          # Notes written for this tag (docs/release-notes/<tag>.md) come first, the install text after them.
          notes="docs/release-notes/$GITHUB_REF_NAME.md"
          {
            if [ -f "$notes" ]; then cat "$notes"; printf '\n---\n\n'; fi
            cat <<NOTES
          Free launcher for Windows Steam games on Apple silicon Macs (macOS 26 Tahoe or newer).

          **Install (recommended):** open Terminal and paste
          \`\`\`
          curl -fsSL https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/scripts/install.sh | bash
          \`\`\`
          The same line updates an existing installation.

          **Or by hand:** open the DMG and drag Nightforge into Applications. On first launch macOS says
          it can't verify the app (it's free and not registered with Apple): open System Settings →
          Privacy & Security, scroll down and click **Open Anyway**.
          NOTES
          } | gh release create "$GITHUB_REF_NAME" "Nightforge-$VERSION.zip" "Nightforge-$VERSION.dmg" \
            --repo "$GITHUB_REPOSITORY" --draft ${kind[@]+"${kind[@]}"} --title "Nightforge $VERSION" --notes-file -
          echo "Drafted. On the maintainer's Mac: scripts/sign-release.sh $GITHUB_REF_NAME --publish" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the signing keychain
        if: always() && env.NIGHTFORGE_CODESIGN_KEYCHAIN != ''
        run: security delete-keychain "$NIGHTFORGE_CODESIGN_KEYCHAIN"
